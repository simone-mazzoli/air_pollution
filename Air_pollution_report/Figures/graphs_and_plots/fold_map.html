<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEA Folds — map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --f1:#e0663c; --f2:#3f7ee6; --f3:#2fa66b; --f4:#8b5cf6;
    --f5:#12b3a6; --f6:#e2a63a; --f7:#d94f8c; --f8:#6470f0; --test:#cbd5e1;
  }
  html,body{margin:0;height:100%;background:#0d1117;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e6edf3}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:14px;left:14px;z-index:1000;max-width:300px;
    background:rgba(13,17,23,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 16px;
    box-shadow:0 20px 50px -25px rgba(0,0,0,.9)}
  .panel h1{font-size:15px;margin:0 0 3px;font-weight:650}
  .panel p{margin:0 0 12px;font-size:11.5px;color:#8b949e;line-height:1.5}
  .lrow{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12px}
  .sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .sw.test{background:repeating-linear-gradient(45deg,#3a4250 0 5px,#4b5563 5px 10px);border:1px dashed #cbd5e1}
  .fname{font-weight:600}
  .cc{color:#8b949e;font-size:10px;margin-left:auto;font-variant:small-caps}
  .leaflet-tooltip.f{background:#161b22;border:1px solid rgba(255,255,255,.15);color:#e6edf3;
    border-radius:7px;font-size:12px;padding:5px 9px;box-shadow:0 6px 18px -6px rgba(0,0,0,.8)}
  .leaflet-tooltip.f .t-fold{color:#8b949e;font-size:10.5px;display:block;margin-top:2px}
  .credit{position:absolute;bottom:6px;right:8px;z-index:1000;font-size:10px;color:#586069}
  .warn{position:absolute;bottom:6px;left:8px;z-index:1000;font-size:10px;color:#8b949e}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>EEA station folds</h1>
  <p>Held-out-region CV. Germany is split by Land — west/south is Alpine, east/north is the sealed test set.</p>
  <div id="legend"></div>
</div>
<div class="warn">Andorra &amp; Malta shown as dots (too small at this resolution).</div>
<div class="credit">borders © Natural Earth · DE states © deutschlandGeoJSON</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const FOLD = {
  fold1_iberia:  {label:"Iberia",              color:css("--f1")},
  fold2_france:  {label:"France & Benelux",    color:css("--f2")},
  fold3_italy:   {label:"Italy",               color:css("--f3")},
  fold4_alpine:  {label:"Alpine (+W/S DE)",    color:css("--f4")},
  fold5_north:   {label:"North & Baltics",     color:css("--f5")},
  fold6_balkan_e:{label:"Balkans (east)",      color:css("--f6")},
  fold7_balkan_s:{label:"Balkans (south)",     color:css("--f7")},
  fold8_poland:  {label:"Poland / CZ / SK",    color:css("--f8")},
  TEST:          {label:"Sealed test — E/N Germany", color:css("--test"), test:true},
};

// current fold country lists (DE handled separately via states)
const F = {
  fold1_iberia:  ["PT","ES","AD"],
  fold2_france:  ["FR","NL","BE","LU"],
  fold3_italy:   ["IT","MT"],
  fold4_alpine:  ["CH","AT"],
  fold5_north:   ["DK","SE","NO","FI","IS","IE","LT","LV","EE"],
  fold6_balkan_e:["HU","SI","HR","BA","RS","XK","ME","RO","BG"],
  fold7_balkan_s:["AL","GR","CY","TR","MK"],
  fold8_poland:  ["PL","CZ","SK"],
};
const CC2FOLD = {};
for(const f in F) for(const cc of F[f]) CC2FOLD[cc]=f;

const DE_TEST = new Set(["Brandenburg","Mecklenburg-Vorpommern","Sachsen","Sachsen-Anhalt",
  "Thüringen","Berlin","Hamburg","Bremen","Niedersachsen","Schleswig-Holstein"]);
const deFold = name => DE_TEST.has(name) ? "TEST" : "fold4_alpine";

const TINY = {AD:[42.55,1.60,"Andorra","fold1_iberia"], MT:[35.90,14.45,"Malta","fold3_italy"]};

const map = L.map("map",{minZoom:3,maxZoom:7,zoomControl:true,attributionControl:false}).setView([50,15],4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",
  {subdomains:"abcd",maxZoom:19}).addTo(map);

function styleFor(fold,hover){
  const f=FOLD[fold];
  return {color:"#0d1117",weight:hover?1.8:0.8,fillColor:f.color,
          fillOpacity:f.test?0.55:0.80,dashArray:f.test?"4 3":null};
}
function bindT(layer,name,fold){
  layer.bindTooltip(`<b>${name}</b><span class="t-fold">${FOLD[fold].label}</span>`,{className:"f",sticky:true});
}
function hoverable(layer,fold){
  layer.on("mouseover",()=>layer.setStyle(styleFor(fold,true)).bringToFront());
  layer.on("mouseout", ()=>layer.setStyle(styleFor(fold,false)));
}

Promise.all([
  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson").then(r=>r.json()),
  fetch("https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/2_bundeslaender/3_mittel.geo.json").then(r=>r.json()),
]).then(([world,de])=>{
  const feats = world.features.filter(f=>{
    const cc=f.properties.ISO_A2_EH||f.properties.ISO_A2;
    return cc!=="DE" && CC2FOLD[cc];
  });
  L.geoJSON({type:"FeatureCollection",features:feats},{
    style:f=>styleFor(CC2FOLD[f.properties.ISO_A2_EH||f.properties.ISO_A2],false),
    onEachFeature:(f,layer)=>{
      const cc=f.properties.ISO_A2_EH||f.properties.ISO_A2, fold=CC2FOLD[cc];
      bindT(layer,f.properties.ADMIN,fold); hoverable(layer,fold);
    }
  }).addTo(map);

  L.geoJSON(de,{
    style:f=>styleFor(deFold(f.properties.name),false),
    onEachFeature:(f,layer)=>{
      const fold=deFold(f.properties.name);
      bindT(layer,"Germany — "+f.properties.name,fold); hoverable(layer,fold);
    }
  }).addTo(map);

  for(const cc in TINY){
    const [lat,lon,nm,fold]=TINY[cc];
    L.circleMarker([lat,lon],{radius:6,color:"#0d1117",weight:1.2,
      fillColor:FOLD[fold].color,fillOpacity:0.95}).addTo(map).bindTooltip(
      `<b>${nm}</b><span class="t-fold">${FOLD[fold].label}</span>`,{className:"f",sticky:true});
  }
  map.fitBounds([[34,-25],[71,45]]);
}).catch(e=>{
  document.querySelector(".panel p").innerHTML =
    "⚠ Could not load map data (network blocked in this viewer). Open the file in a normal browser. ["+e+"]";
});

const codesByFold={};
for(const f in F) codesByFold[f]=F[f].join(" ");
document.getElementById("legend").innerHTML = Object.keys(FOLD).map(k=>{
  const f=FOLD[k];
  const sw=f.test?`<span class="sw test"></span>`:`<span class="sw" style="background:${f.color}"></span>`;
  const cc=f.test?"E/N DE":(codesByFold[k]||"");
  return `<div class="lrow">${sw}<span class="fname">${f.label}</span><span class="cc">${cc}</span></div>`;
}).join("");
</script>
</body>
</html>
